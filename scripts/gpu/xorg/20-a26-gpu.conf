# Xorg for Moon's GPU mode (notes/gpu/DESIGN.md): headless on the dummy video
# driver. moon-compositor owns the panel; what Xorg draws reaches it through
# Moon's X mirror. Input is configured exactly as for the panel session
# (30-a26-input.conf, copied from xorg.conf.d by scripts/gpu/install.sh).
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "true"
    Option "AllowEmptyInput" "true"
    Option "DontVTSwitch" "true"
    Option "DontZap" "false"
EndSection

Section "Monitor"
    Identifier "A26-Headless-Monitor"
    HorizSync 5.0 - 1000.0
    VertRefresh 5.0 - 200.0
    # 1080x2340 at 60 Hz; the timing is nominal, nothing scans it out.
    Modeline "1080x2340" 164.26 1080 1088 1120 1160 2340 2343 2350 2360
    Option "PreferredMode" "1080x2340"
EndSection

Section "Device"
    Identifier "A26-Headless"
    Driver "dummy"
    # KiB; a 1080x2340 32-bit frame is about 10 MB.
    VideoRam 32768
EndSection

Section "Screen"
    Identifier "A26-Screen"
    Device "A26-Headless"
    Monitor "A26-Headless-Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1080x2340"
        Virtual 1080 2340
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "A26-Layout"
    Screen 0 "A26-Screen"
    InputDevice "A26-Touchscreen" "CorePointer"
    InputDevice "A26-Volume-Keys" "CoreKeyboard"
EndSection
