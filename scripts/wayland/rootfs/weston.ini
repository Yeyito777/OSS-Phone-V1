# Weston on the A26 for the Wayland experiment (pixman renderer, no GPU).
[core]
idle-time=0
require-input=false
repaint-window=7

[shell]
panel-position=none
background-color=0xff101828
locking=false
animation=none
startup-animation=none

[output]
name=DSI-1
mode=current

[output]
name=Writeback-1
mode=off

[libinput]
enable-tap=true
