# The phone's SSH server (docs/SSH.md), run by the Exocortex keeper as
# `sshd -D -e -f /etc/ssh/oss-phone-sshd.conf` in a mount namespace of its
# own. Root, by key only, lands in the chroot.
Port 2222
ListenAddress 0.0.0.0
ListenAddress ::
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_rsa_key
PermitRootLogin prohibit-password
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
PrintMotd no
AllowTcpForwarding yes
AllowStreamLocalForwarding yes
X11Forwarding no
ClientAliveInterval 30
ClientAliveCountMax 4
AcceptEnv LANG LC_* TERM COLORTERM
PidFile none
Subsystem sftp internal-sftp
# Every session, interactive or not, gets the chroot's whole environment.
SetEnv PATH=/usr/local/sbin:/usr/local/bin:/opt/bun/bin:/root/.local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 EXOCORTEX_SUPERVISOR=/usr/local/bin/exocortex-supervisor IS_SANDBOX=1 DISPLAY=:0
