[package]
name = "a26-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal touch-first X11 window manager and phone shell for the Galaxy A26"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
libc = "0.2"
x11rb = { version = "0.14", features = ["xinput", "randr", "dpms", "dri3", "present", "render", "shape", "xtest", "shm", "damage"] }
fontdue = { version = "0.9", default-features = false, features = ["std", "simd"] }
png = "0.17"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
# The Wayland server (pure-Rust backend, linked statically like the rest).
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "unstable"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
# Protocol tests drive the Wayland server with a real client in-process.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server", "unstable"] }
